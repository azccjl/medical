# Staged candidate; never authorizes physical navigation.
# Use only the audited candidate's unclamped encoder after low-speed field validation.
TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: map
  max_vel_x: 0.12
  max_vel_x_backwards: 0.0
  max_vel_theta: 0.16
  acc_lim_x: 0.20
  acc_lim_theta: 0.40
  min_turning_radius: 0.75
  wheelbase: 0.17
  cmd_angle_instead_rotvel: false
  allow_init_with_backwards_motion: false
  free_goal_vel: false
  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.15
  min_obstacle_dist: 0.15
  inflation_dist: 0.25
  dt_ref: 0.3
  dt_hysteresis: 0.1
  feasibility_check_no_poses: 10
  max_global_plan_lookahead_dist: 1.5
  teb_autosize: true
  enable_homotopy_class_planning: false
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 100
  weight_kinematics_turning_radius: 100
  weight_obstacle: 50
  footprint_model:
    type: polygon
    vertices: [[0.245, 0.11], [0.245, -0.11], [-0.100, -0.11], [-0.100, 0.11]]
