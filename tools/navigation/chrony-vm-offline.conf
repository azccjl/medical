# Ubuntu VM is the one-way LAN clock authority. No upstream robot source.
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
local stratum 8
allow 192.168.12.1/32
bindaddress 192.168.12.71
bindcmdaddress 127.0.0.1
cmdport 323
# Never step a running ROS clock.
maxchange 0.5 0 0
maxslewrate 10000
